<body>
    <div class="carta">
        <h1>Cafetería Mágica</h1>
        
        <p class="especial"> Café espresso (Especialidad)</p>

<!-- El div reserva mete a la galleta dentro, así que ya no es hija directa de .carta ni hermana de .especial. Por eso no coge la línea ni el color rosa, solo hereda el gris y la letra Arial. -->
